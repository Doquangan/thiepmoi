# Netlify Configuration for HCMUS Graduation Invitation App

[build]
  publish = "."

[[redirects]]
  from = "/admin-server"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/event-config.json"
  to = "/event-config.json"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
