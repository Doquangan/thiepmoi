<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Netlify Forms Skeleton - Thiep Moi Tot Nghiep</title>
</head>
<body>
  <!-- Static form skeleton to ensure 100% reliable detection by Netlify Build Form Crawler -->
  <form name="wishes" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="wishes" />
    <input type="hidden" name="subject" value="💌 Lời nhắn tốt nghiệp từ bạn bè" />
    <input type="hidden" name="guestUrl" value="" />
    <p class="hidden"><input name="bot-field" /></p>
    <input type="text" name="senderName" />
    <textarea name="message"></textarea>
    <input type="text" name="contact" />
  </form>
</body>
</html>
